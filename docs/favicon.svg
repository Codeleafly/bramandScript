<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Background Card -->
  <rect width="100" height="100" rx="24" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.3" />
  <!-- Central Four-Pointed Star (Bramand ✦) -->
  <path d="M50 16 Q50 50 84 50 Q50 50 50 84 Q50 50 16 50 Q50 50 50 16 Z" fill="url(#starGrad)" filter="url(#glow)" />
  <circle cx="50" cy="50" r="5" fill="#ffffff" />
</svg>
